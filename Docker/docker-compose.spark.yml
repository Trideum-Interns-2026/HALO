# NVIDIA DGX Spark (native Linux, ARM64, real GPU) override.
# Usage: docker compose -f docker-compose.yml -f docker-compose.spark.yml run --rm px4-sitl
#
# Before running, on the Spark itself (not in the container):
#   xhost +local:docker

services:
  px4-sitl:
    network_mode: host
    gpus: all
    environment:
      - DISPLAY=${DISPLAY}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
