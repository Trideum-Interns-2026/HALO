services:
  px4-sitl:
    build:
      context: .
      args:
        PX4_TARGET: gazebo-classic_typhoon_h480
    image: px4-sitl-dev:latest
    privileged: true
    network_mode: host
    environment:
      - DISPLAY=host.docker.internal:0.0
    working_dir: /PX4-Autopilot
    volumes:
      - px4-workspace:/PX4-Autopilot
    stdin_open: true
    tty: true

volumes:
  px4-workspace: